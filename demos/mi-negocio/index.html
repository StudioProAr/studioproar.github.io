<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mi negocio · panel</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f1115"><link rel="apple-touch-icon" href="icono-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<style>
:root{--bg:#0f1115;--card:#181b22;--ink:#eef0f4;--soft:#9aa3b2;--line:#2a2f3a;--ac:#7aa2ff;--ok:#4cc79b;--warn:#e7a650;--ro:#ef6b6b;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Figtree,system-ui,sans-serif}
.in{max-width:860px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:22px 0 8px;color:var(--soft);text-transform:uppercase;letter-spacing:.08em}
button,select,input{font:inherit}button{cursor:pointer}
.btn{background:var(--ac);color:#0b1020;border:0;border-radius:10px;padding:9px 14px;font-weight:700}
.sec{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:7px 12px}
input,select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tabs button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 14px}
.tabs button[aria-pressed=true]{background:var(--ac);color:#0b1020;border-color:var(--ac);font-weight:700}
.it{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.it .h{font-weight:800;font-size:18px;min-width:56px}.it small{color:var(--soft)}.it .ac{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:12px;border-radius:999px;padding:2px 8px;border:1px solid var(--line)}.tag.nuevo{border-color:var(--warn);color:var(--warn)}.tag.listo,.tag.atendido{border-color:var(--ok);color:var(--ok)}.tag.cancelado{color:var(--ro);border-color:var(--ro)}
.vacio{color:var(--soft);padding:20px 0}.it.lib{padding:8px 12px;background:transparent}.it.pas{opacity:.5}.tabs.dias{overflow-x:auto;flex-wrap:nowrap;padding-bottom:6px}.tabs.dias button{white-space:nowrap}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.kpi b{display:block;font-size:26px}.kpi span{color:var(--soft);font-size:13px}
.bar{display:flex;align-items:flex-end;gap:3px;height:120px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}.bar i{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px}
.fila{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}
#login{max-width:360px;margin:60px auto}#login p{color:var(--soft)}.err{color:var(--ro)}
a{color:var(--ac)}
</style>
</head>
<body>
<div class="in">
  <header><h1 id="tit">Mi negocio</h1><div><select id="sitio" aria-label="Negocio" style="width:auto"></select> <button class="sec" id="salir" hidden>Salir</button></div></header>
  <form id="login" hidden><h1 id="ltit">Entrar al panel</h1><p id="ltxt">Entrá con tu mail y tu clave.</p>
    <label>Mail<input id="em" type="email" autocomplete="username" required></label><br><br>
    <label>Clave<input id="pw" type="password" autocomplete="current-password" required minlength="6"></label><br><br>
    <label id="pw2l" hidden>Repetí la clave<input id="pw2" type="password" autocomplete="new-password" minlength="6"></label><br id="pw2br" hidden>
    <button class="btn" type="submit" id="lbtn">Entrar</button> <span class="err" id="lerr"></span>
    <p><a href="#" id="olv">Me olvidé la clave</a></p></form>
  <main id="app"></main>
</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>window.SPA_SIEMPRE_REAL = true;</script>

  }
  function turnosV() {

    return turnosV1();

  function turnosV1() {
    var l = datos.turnos || [], oc = datos.ocup || {}, P = NEG[s].paso || 30, hoy = hoyIso(), dias = diasAbiertos();
