<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mi negocio · panel</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f1115"><link rel="apple-touch-icon" href="icono-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<style>
:root{--bg:#0f1115;--card:#181b22;--ink:#eef0f4;--soft:#9aa3b2;--line:#2a2f3a;--ac:#7aa2ff;--ok:#4cc79b;--warn:#e7a650;--ro:#ef6b6b;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Figtree,system-ui,sans-serif}
.in{max-width:860px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:22px 0 8px;color:var(--soft);text-transform:uppercase;letter-spacing:.08em}
button,select,input{font:inherit}button{cursor:pointer}
.btn{background:var(--ac);color:#0b1020;border:0;border-radius:10px;padding:9px 14px;font-weight:700}
.sec{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:7px 12px}
input,select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tabs button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 14px}
.tabs button[aria-pressed=true]{background:var(--ac);color:#0b1020;border-color:var(--ac);font-weight:700}
.it{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.it .h{font-weight:800;font-size:18px;min-width:56px}.it small{color:var(--soft)}.it .ac{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:12px;border-radius:999px;padding:2px 8px;border:1px solid var(--line)}.tag.nuevo{border-color:var(--warn);color:var(--warn)}.tag.listo,.tag.atendido{border-color:var(--ok);color:var(--ok)}.tag.cancelado{color:var(--ro);border-color:var(--ro)}
.vacio{color:var(--soft);padding:20px 0}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.kpi b{display:block;font-size:26px}.kpi span{color:var(--soft);font-size:13px}
.bar{display:flex;align-items:flex-end;gap:3px;height:120px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}.bar i{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px}
.fila{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}
#login{max-width:360px;margin:60px auto}#login p{color:var(--soft)}.err{color:var(--ro)}
a{color:var(--ac)}
</style>
</head>
<body>
<div class="in">
  <header><h1 id="tit">Mi negocio</h1><div><select id="sitio" aria-label="Negocio" style="width:auto"></select> <button class="sec" id="salir" hidden>Salir</button></div></header>
  <form id="login" hidden><h1>Entrar al panel</h1><p>Usá el mail y la clave que te dio StudioProAr.</p>
    <label>Mail<input id="em" type="email" autocomplete="username" required></label><br><br>
    <label>Clave<input id="pw" type="password" autocomplete="current-password" required></label><br><br>
    <button class="btn" type="submit">Entrar</button> <span class="err" id="lerr"></span>
    <p><a href="#" id="olv">Me olvidé la clave</a></p></form>
  <main id="app"></main>
</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>window.SPA_SIEMPRE_REAL = true;</script>
<script src="../comun/fb-demos.js"></script>
<!-- En un cliente: reemplazar fb-demos.js por su firebase-config.js y agregar negocio.js -->
<script>
(function () {
  /* Para un cliente: definir window.NEGOCIO = { sitio:'mi-local', nombre:'Mi Local', secciones:['turnos','stats'] } en negocio.js */
  var NEG = window.NEGOCIO ? {} : { salon: { n: 'Salón Quebracho', t: ['turnos', 'stats'] }, vet: { n: 'Patitas del Delta', t: ['turnos', 'stats'] }, panaderia: { n: 'El Horno de Victoria', t: ['encargos', 'stats'] }, cafe: { n: 'Café Muelle', t: ['stats'] }, ferreteria: { n: 'Ferretería La Llave', t: ['stats'] }, fogon: { n: 'Parrilla El Fogón', t: ['stats'] }, astillero: { n: 'Astillero Marea Alta', t: ['stats'] } };
  if (window.NEGOCIO) NEG[window.NEGOCIO.sitio] = { n: window.NEGOCIO.nombre, t: window.NEGOCIO.secciones || ['stats'] };
  var NOM = { turnos: 'Turnos', encargos: 'Encargos', stats: 'Estadísticas' };
  var $ = function (id) { return document.getElementById(id); }, esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var q = new URLSearchParams(location.search), s = NEG[q.get('s')] ? q.get('s') : 'salon', vista = NEG[s].t[0], datos = {}, refs = [], vistos = null;
  firebase.initializeApp(window.FIREBASE_CONFIG);
  var auth = firebase.auth(), db = firebase.database(), app = $('app');
  $('sitio').innerHTML = Object.keys(NEG).map(function (k) { return '<option value="' + k + '"' + (k === s ? ' selected' : '') + '>' + NEG[k].n + '</option>'; }).join('');
  if (window.NEGOCIO) $('sitio').hidden = true;
  try { var g = localStorage.getItem('mn_sitio'); if (!q.get('s') && g && NEG[g]) { s = g; $('sitio').value = g; } localStorage.setItem('mn_sitio', s); } catch (e) {}
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  $('sitio').onchange = function () { location.search = '?s=' + this.value; };
  $('tit').textContent = NEG[s].n;
  var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  var hh = function (m) { return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
  var hoyIso = function (d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  var fechaTxt = function (f) { var p = f.split('-'), d = new Date(+p[0], p[1] - 1, +p[2]); return (f === hoyIso() ? 'Hoy, ' : '') + DIAS[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1); };
  var wa = function (cel, txt) { return cel ? '<a class="sec" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/549' + esc(cel) + '?text=' + encodeURIComponent(txt) + '">WhatsApp</a>' : ''; };
  function beep() { try { var a = new AudioContext(), o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.value = .15; o.start(); setTimeout(function () { o.stop(); a.close(); }, 250); } catch (e) {} }

  function turnosV() {
    var l = datos.turnos || [], hoy = hoyIso(), fut = l.filter(function (t) { return t.fecha >= hoy && t.estado !== 'cancelado'; }), h = '', dia = '';
    if (!fut.length) return '<p class="vacio">No hay turnos próximos. Cuando alguien reserve en la web, aparece acá al instante.</p>';
    fut.forEach(function (t) {
      if (t.fecha !== dia) { dia = t.fecha; h += '<h2>' + fechaTxt(dia) + '</h2>'; }
      h += '<div class="it"><div class="h">' + hh(t.ini) + '</div><div><b>' + esc(t.nombre) + '</b> <span class="tag ' + esc(t.estado) + '">' + esc(t.estado) + '</span><br><small>' + esc(t.servicio) + ' · ' + t.min + ' min' + (t.cel ? ' · ' + esc(t.cel) : '') + '</small></div><div class="ac">' +
        wa(t.cel, 'Hola ' + t.nombre + '! Te recordamos tu turno de ' + t.servicio + ' el ' + fechaTxt(t.fecha) + ' a las ' + hh(t.ini) + '. Te esperamos!') +
        (t.estado !== 'atendido' ? '<button class="sec" data-t="' + t._id + '" data-e="atendido">Atendido</button>' : '') + '<button class="sec" data-t="' + t._id + '" data-e="cancelado">Cancelar</button></div></div>';
    });
    return h;
  }
  function encargosV() {
    var l = (datos.encargos || []).slice().reverse();
    if (!l.length) return '<p class="vacio">No hay encargos. Cuando alguien encargue en la web, aparece acá al instante.</p>';
    return l.map(function (p) {
      var sig = { nuevo: 'listo', listo: 'entregado' }[p.estado];
      return '<div class="it"><div class="h">$' + Number(p.total || 0).toLocaleString('es-AR') + '</div><div><b>' + esc(p.nombre) + '</b> <span class="tag ' + esc(p.estado) + '">' + esc(p.estado) + '</span><br><small>Retiro: ' + esc(p.ret) + '</small><br><small>' + (p.items || []).map(function (x) { return x.c + ' × ' + esc(x.n); }).join(' · ') + '</small></div><div class="ac">' +
        wa(p.cel, 'Hola ' + p.nombre + '! Tu encargo ya está listo para retirar (' + p.ret + ').') +
        (sig ? '<button class="sec" data-p="' + p._id + '" data-e="' + sig + '">Marcar ' + sig + '</button>' : '') + (p.estado !== 'cancelado' && p.estado !== 'entregado' ? '<button class="sec" data-p="' + p._id + '" data-e="cancelado">Cancelar</button>' : '') + '</div></div>';
    }).join('');
  }
  function statsV() {
    var st = datos.stats || {}, v = st.visitas || {}, d30 = [], tot = 0;
    for (var i = 29; i >= 0; i--) { var d = new Date(); d.setDate(d.getDate() - i); var k = hoyIso(d); d30.push(v[k] || 0); tot += v[k] || 0; }
    var max = Math.max.apply(null, d30.concat([1]));
    var suma = function (t) { var r = {}; Object.keys(st[t] || {}).forEach(function (dia) { Object.keys(st[t][dia]).forEach(function (k) { r[k] = (r[k] || 0) + st[t][dia][k]; }); }); return r; };
    var lista = function (o) { var ks = Object.keys(o).sort(function (a, b) { return o[b] - o[a]; }); return ks.map(function (k) { return '<div class="fila"><span>' + esc(k) + '</span><b>' + o[k] + '</b></div>'; }).join('') || '<p class="vacio">Sin datos todavía.</p>'; };
    var cl = suma('clics');
    return '<div class="kpis"><div class="kpi"><b>' + tot + '</b><span>visitas en 30 días</span></div><div class="kpi"><b>' + (v[hoyIso()] || 0) + '</b><span>visitas hoy</span></div><div class="kpi"><b>' + (cl.whatsapp || 0) + '</b><span>clics a WhatsApp</span></div></div>' +
      '<h2>Visitas por día (30 días)</h2><div class="bar">' + d30.map(function (n) { return '<i style="height:' + (n / max * 100) + '%" title="' + n + '"></i>'; }).join('') + '</div>' +
      '<h2>De dónde vienen</h2>' + lista(suma('origen')) + '<h2>Botones tocados</h2>' + lista(cl) + '<h2>Páginas más vistas</h2>' + lista(suma('paginas')) + '<h2>Celular o compu</h2>' + lista(suma('disp'));
  }
  function pinta() {
    app.innerHTML = '<div class="tabs">' + NEG[s].t.map(function (t) { var n = t === 'turnos' ? (datos.turnos || []).filter(function (x) { return x.estado === 'nuevo' || (x.estado === 'confirmado' && x.fecha === hoyIso()); }).length : t === 'encargos' ? (datos.encargos || []).filter(function (x) { return x.estado === 'nuevo'; }).length : 0; return '<button data-v="' + t + '" aria-pressed="' + (t === vista) + '">' + NOM[t] + (n ? ' (' + n + ')' : '') + '</button>'; }).join('') + '</div>' +
      (vista === 'turnos' ? turnosV() : vista === 'encargos' ? encargosV() : statsV());
  }
  app.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.v) { vista = b.dataset.v; pinta(); return; }
    var base = 'r/' + s;
    if (b.dataset.t) {
      var t = (datos.turnos || []).filter(function (x) { return x._id === b.dataset.t; })[0]; if (!t) return;
      if (b.dataset.e === 'cancelado' && !confirm('¿Cancelar el turno de ' + t.nombre + '? El horario queda libre en la web.')) return;
      var up = {}; up[base + '/turnos/lista/' + t._id + '/estado'] = b.dataset.e;
      if (b.dataset.e === 'cancelado') for (var m = t.ini; m < t.ini + t.min; m += 30) up[base + '/turnos/ocupado/' + t.fecha + '/' + m] = null;
      b.disabled = true; db.ref().update(up).catch(function () { b.disabled = false; alert('No se pudo guardar.'); });
    }
    if (b.dataset.p) { b.disabled = true; db.ref(base + '/encargos/lista/' + b.dataset.p + '/estado').set(b.dataset.e).catch(function () { b.disabled = false; alert('No se pudo guardar.'); }); }
  });
  function escuchar() {
    refs.forEach(function (r) { r.off(); }); refs = [];
    NEG[s].t.forEach(function (t) {
      var r = t === 'stats' ? db.ref('sitios/' + s + '/stats') : db.ref('r/' + s + '/' + t + '/lista');
      refs.push(r);
      r.on('value', function (sn) {
        if (t === 'stats') { datos.stats = sn.val() || {}; return pinta(); }
        var a = []; sn.forEach(function (c) { var v = c.val(); v._id = c.key; a.push(v); });
        if (t === 'turnos') a.sort(function (x, y) { return (x.fecha + String(x.ini).padStart(4, '0')) < (y.fecha + String(y.ini).padStart(4, '0')) ? -1 : 1; });
        if (vistos && a.some(function (x) { return !vistos[x._id]; })) beep();
        vistos = vistos || {}; a.forEach(function (x) { vistos[x._id] = 1; });
        datos[t] = a; pinta();
      }, function () { app.innerHTML = '<p class="err">No se pudieron leer los datos.</p>'; });
    });
  }
  $('login').onsubmit = function (e) { e.preventDefault(); $('lerr').textContent = ''; auth.signInWithEmailAndPassword($('em').value.trim(), $('pw').value).catch(function () { $('lerr').textContent = 'Mail o clave incorrectos.'; }); };
  $('olv').onclick = function (e) { e.preventDefault(); var m = $('em').value.trim(); if (!m) { $('lerr').textContent = 'Escribí tu mail arriba.'; return; } auth.sendPasswordResetEmail(m).then(function () { $('lerr').textContent = 'Te mandamos un mail para cambiar la clave.'; }, function () { $('lerr').textContent = 'No se pudo enviar.'; }); };
  $('salir').onclick = function () { auth.signOut(); };
  auth.onAuthStateChanged(function (u) {
    refs.forEach(function (r) { r.off(); }); refs = []; app.innerHTML = '';
    if (!u) { $('login').hidden = false; $('salir').hidden = true; return; }
    db.ref('web/roles/' + u.uid).once('value').then(function (r) {
      if (r.val() !== 'admin') { auth.signOut(); $('lerr').textContent = 'Este usuario no tiene permiso.'; return; }
      $('login').hidden = true; $('salir').hidden = false; escuchar();
    }, function () { $('lerr').textContent = 'No se pudo verificar el permiso.'; });
  });
})();
</script>
</body>
</html>
